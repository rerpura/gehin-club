<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下品倶楽部</title><style>
:root{--r:#861f1f;--g:#d9b45d;--d:#241b17}*{box-sizing:border-box}body{margin:0;background:#ead9ba;color:#251d18;font-family:"Yu Mincho",serif}header{background:var(--d);color:#fff1cf;text-align:center;padding:50px 15px;border-bottom:6px double var(--g)}h1{font-size:clamp(42px,9vw,75px);letter-spacing:.15em;margin:0}main{max-width:900px;margin:auto;padding:20px}section{background:#fffaf0;border:2px solid #4b362b;box-shadow:7px 7px #9c5235;padding:22px;margin:22px 0}h2{color:var(--r);border-bottom:3px double var(--r)}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #8b7967}textarea{height:90px;resize:vertical}button{padding:11px 17px;border:0;background:var(--r);color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#555}.output,.post{background:white;border-left:5px solid var(--g);padding:14px;margin:12px 0}.postHead{display:flex;justify-content:space-between;color:#725f50;font-size:13px}.post p{white-space:pre-wrap}.member{background:linear-gradient(135deg,#8a261e,#24110f);color:#fff1c8;border:5px double var(--g);padding:23px;border-radius:12px;margin-top:15px}.small{font-size:13px;color:#75685e}.status{padding:9px;background:#f1e6ce}.delete{float:right;padding:5px 9px;font-size:12px}footer{text-align:center;background:var(--d);color:#fff1cf;padding:25px}</style></head><body>
<header><h1>下品倶楽部</h1><p>背伸びをやめて、堂々とくだらなく。</p></header><main>
<section><h2>今日の言い訳メーカー</h2><div id="excuse" class="output">まだ生成されていません。</div><button id="excuseBtn">言い訳を生成</button></section>
<section><h2>会員証発行所</h2><input id="memberName" maxlength="18" placeholder="会員名"><input id="memberTitle" maxlength="24" placeholder="肩書き"><button id="issueBtn">会員証を発行</button><button id="saveCardBtn">📸会員証を保存</button><div class="member"><small>下品倶楽部 公式会員証</small><h3 id="cardName">名もなき会員</h3><p id="cardTitle">肩書き：一般会員</p><p id="cardNo">NO. 000000</p></div></section>
<section><h2>共有掲示板</h2><p id="status" class="status">接続中...</p><input id="postName" maxlength="18" placeholder="名前（空欄なら匿名会員）"><textarea id="postText" maxlength="240" placeholder="240文字以内。個人情報は書かないでください。"></textarea><button id="postBtn" disabled>書き込む</button><p class="small">投稿は全利用者に公開されます。自分の投稿のみ削除できます。</p><div id="posts"></div></section>
</main>
<footer>© 2026 下品倶楽部</footer>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script type="module" src="./app.js"></script>

</body>
</html>
